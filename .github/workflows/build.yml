name: APK qurish

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: JDK o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Imzo uchun keystore yaratish
        run: keytool -genkeypair -v -keystore release.keystore -alias ocrtarjimon -storepass ocrtarjimon123 -keypass ocrtarjimon123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Lutfullo, OU=Dev, O=OCRTarjimon, L=Tashkent, S=Tashkent, C=UZ"

      - name: Android SDK litsenziyalarini qabul qilish
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Kerakli SDK paketlarini o'rnatish
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Release APK qurish
        run: gradle assembleRelease

      - name: Release sifatida yuklash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OCR Tarjimon
          files: app/build/outputs/apk/release/app-release.apk
